<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#f2f6ef;--card:#ffffff;--ink:#12261a;--muted:#5f7266;--line:#dde7d8;--brand:#0b5d2a;--brandbg:#e0f0d6;--accent:#55a51c;--onbrand:#ffffff;
 --ok:#2f8a10;--okbtn:#2f8a10;--okbg:#e0f3d3;--warn:#9a5b00;--warnbg:#fdebc3;--bad:#b42318;--badbg:#fde1de;--chip:#e8efe3;--btn:#0b5d2a;--btntxt:#ffffff;--shadow:0 1px 3px rgba(16,40,20,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1710;--card:#16241a;--ink:#edf5ea;--muted:#9bb3a2;--line:#27402d;--brand:#86d65a;--brandbg:#1f3a1d;--accent:#55a51c;--onbrand:#0d1f0a;--ok:#8fe06a;--okbtn:#2f8a10;--okbg:#1d3a17;--warn:#f2bd5a;--warnbg:#3d2f10;--bad:#ff8b7d;--badbg:#431a16;--chip:#21342a;--btn:#2f8a10;--shadow:none}}
:root[data-theme="dark"]{--bg:#0d1710;--card:#16241a;--ink:#edf5ea;--muted:#9bb3a2;--line:#27402d;--brand:#86d65a;--brandbg:#1f3a1d;--accent:#55a51c;--onbrand:#0d1f0a;--ok:#8fe06a;--okbtn:#2f8a10;--okbg:#1d3a17;--warn:#f2bd5a;--warnbg:#3d2f10;--bad:#ff8b7d;--badbg:#431a16;--chip:#21342a;--btn:#2f8a10;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
#top{border-bottom:3px solid var(--accent)}#top .logo{display:flex;align-items:center;gap:10px;font-size:18px;color:var(--brand);min-width:0}#top .logo b{line-height:1.1;white-space:nowrap;font-size:clamp(14px,4.2vw,18px)}#top .pill{font-size:11px;padding:4px 8px}@media(max-width:420px){#top{padding:8px 10px}#top .lg img{height:38px}}#top .lg{background:#fff;border-radius:10px;padding:2px;display:flex;border:1px solid var(--line)}#top .lg img{height:44px;width:auto;display:block}.brandhero{text-align:center;padding:6px 0}.brandhero img{width:150px;max-width:50%;height:auto;background:#fff;border-radius:16px;padding:6px}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}
main{max-width:1040px;margin:0 auto;padding:12px 12px 96px}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav#nav .in{display:flex;width:100%;max-width:640px;gap:4px}
nav#nav button{flex:1;position:relative;border:0;background:none;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav#nav button span.ic{font-size:22px;line-height:1}
nav#nav button.on{background:var(--brandbg);color:var(--brand);font-weight:700}
nav#nav .bd{position:absolute;top:0;right:18%;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15px}
h2{margin:0 0 12px;font-size:20px}
.muted{color:var(--muted)}small,.sub{font-size:13px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 8px;font-size:15px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--btn);color:var(--btntxt);min-height:46px}
.btn.ghost{background:var(--chip);color:var(--ink)}.btn.danger{background:var(--bad);color:#fff}.btn.ok{background:var(--okbtn);color:#fff}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.lnk{border:0;background:none;color:var(--brand);padding:2px 0;font-size:13px;text-decoration:underline}
.ibtn{border:1px solid var(--line);background:var(--chip);border-radius:12px;min-width:46px;min-height:46px;font-size:20px}
input[type=text],input:not([type]),input[type=search],select{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);outline:none}
input:focus,select:focus{border-color:var(--brand)}
label,.lbl{display:block;margin:10px 0 4px;font-size:13px;font-weight:600;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--chip);color:var(--muted)}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}
/* caja */
.pos{display:grid;gap:12px}
@media(min-width:860px){.pos{grid-template-columns:1.25fr 1fr;align-items:start}.right{position:sticky;top:calc(64px + env(safe-area-inset-top,0px))}}
.scanbox{display:flex;gap:8px;margin-bottom:8px}
#scan{font-size:19px;min-height:56px;border-color:var(--brand);border-width:2px}
#sug,.sugbox{display:grid;gap:6px;margin-bottom:10px}
.sug{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:52px}
.sug span{display:flex;flex-direction:column;min-width:0}.sug .r{text-align:right;flex:none}
.line{display:grid;grid-template-columns:1fr auto auto 34px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .ln{min-width:0}.line .ln b{display:block;overflow-wrap:anywhere}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--chip);font-size:20px;font-weight:700}
.qin{width:58px!important;min-height:40px!important;text-align:center;padding:4px!important;font-weight:700}
.lt{font-weight:700;min-width:74px;text-align:right}
.x{border:0;background:none;color:var(--muted);font-size:18px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0;font-size:15px;color:var(--muted)}
.total b{font-size:34px;color:var(--ink)}
.cobrar{width:100%;min-height:62px;border:0;border-radius:14px;background:var(--okbtn);color:#fff;font-size:22px;font-weight:800}
.cobrar:disabled{opacity:.4}
.vuelto{font-size:20px;font-weight:800;min-height:28px;margin:4px 0}.vuelto.ok{color:var(--ok)}.vuelto.bad{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:left;min-height:68px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.tile b{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.tile span{font-size:13px;color:var(--brand);font-weight:700}
.laststrip{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--okbg);color:var(--ok);padding:10px 14px;border-radius:12px;margin-bottom:12px;font-weight:600}
/* listas */
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 4px;min-height:58px}
.row:last-child{border-bottom:0}.row .nm{min-width:0}.row .nm b{display:block;overflow-wrap:anywhere}.row .rt{text-align:right}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi small{display:block;font-weight:600}.kpi b{font-size:22px;display:block;margin-top:2px}
.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}.kpi.ok b{color:var(--ok)}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:8px 0;font-size:14px}
.bar .tr{grid-column:1/-1;height:8px;border-radius:6px;background:var(--chip);overflow:hidden}.bar .tr i{display:block;height:100%;background:var(--brand);border-radius:6px}
.frow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.frow:last-child{border-bottom:0}.frow b{white-space:nowrap}.frow small{display:block}
svg text{fill:var(--muted);font-size:11px}
/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,15,25,.55);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:20px}}
.btns{display:flex;gap:10px;margin-top:16px}.btns .btn{flex:1}
.big{font-size:17px}
video{width:100%;border-radius:14px;background:#000;margin-bottom:10px}
#toast{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;justify-content:center;pointer-events:none}
#toast .t{pointer-events:auto;background:#0e2a17;color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;display:flex;gap:14px;align-items:center;max-width:92%}
#toast .t.bad{background:var(--bad)}#toast .t button{background:none;border:0;color:#b6ee9a;font-weight:800}
.warnbar{background:var(--warnbg);color:var(--warn);padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:14px}
nav#nav .bd.amb{background:#e0a100;color:#1d1400}
nav#nav .bd.red{animation:pulse 1.3s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(180,35,24,.6)}70%{box-shadow:0 0 0 9px rgba(180,35,24,0)}100%{box-shadow:0 0 0 0 rgba(180,35,24,0)}}
@media (prefers-reduced-motion:reduce){nav#nav .bd.red{animation:none}}
.alertbar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bad);color:#fff}
.alertbar span{display:flex;flex-direction:column;min-width:0;flex:1}.alertbar small{color:#ffe3df;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.alertbar .go{flex:none;font-weight:800}
.alertbar .dot{flex:none;width:14px;height:14px;border-radius:50%;background:#fff;flex:none;animation:pulse2 1.2s infinite}
@keyframes pulse2{50%{opacity:.35}}
.brow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px;border-left:7px solid;border-radius:12px;margin-bottom:8px}
.brow.r1{border-color:var(--bad);background:var(--badbg)}.brow.r2{border-color:#e0a100;background:var(--warnbg)}
.brow .nm b{display:block;overflow-wrap:anywhere}.brow .meta{font-size:13px;color:var(--muted);margin:2px 0}.brow .adv{font-size:13px;font-weight:600}.brow .rt{text-align:right}
.rot{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--ink)}
.rot.alta{background:var(--bad);color:#fff}.rot.media{background:#e0a100;color:#1d1400}
.sech{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;font-size:16px;font-weight:800}.sech small{font-weight:500}
#picker{margin-bottom:12px;border:2px solid var(--brand)}#picker[hidden]{display:none}
.catrow{display:block;width:100%;text-align:left;border:0;background:none;padding:2px 0}
.tag.in{background:var(--brand);color:var(--onbrand)}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.three label{font-size:12px}
textarea{width:100%;min-height:200px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:10px}
</style>
</head>

 toast('Leyendo el Excel…',{ms:6000});
 Promise.all([file.arrayBuffer(),loadXlsx()]).then(function(r){
  var wb=XLSX.read(r[0],{type:'array'});
  var name=wb.SheetNames.filter(function(n){return /registro.*venta/i.test(n)})[0]||wb.SheetNames[0];
  var rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
  var have={};S.lines.forEach(function(l){have[l.id]=1});
  var add={},nNew=0,nDup=0,miss=[];
  rows.forEach(function(row,ix){
   var rn=ix+1,f=row[0],c=row[2],q=row[3];
   if(typeof f!=='number'||f<40000||c==null||String(c).trim()===''||typeof q!=='number'||q<=0)return;
   var id='h'+rn;if(have[id]){nDup++;return}
   var p=null,N=row[13];
   if(typeof N==='number'&&N>0)p=prodById('p'+String(N).padStart(3,'0'));
   if(!p)p=byCode(String(c).trim());
   if(!p){var sr=search(String(c),2);if(sr.length===1)p=sr[0]}
   if(!p){miss.push('Fila '+rn+': '+c);return}
   var d=new Date(Date.UTC(1899,11,30)+Math.floor(f)*D),key=d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
   var t=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),17,0,0)+rn;
   var ing=typeof row[8]==='number'?row[8]:r2(q*p.p),cos=typeof row[9]==='number'?row[9]:r2(q*p.k);
   (add[key]=add[key]||[]).push({id:id,tk:id,t:t,c:String(row[1]==null?'':row[1]).trim(),p:p.id,q:q,i:ing,k:cos});nNew++});
  Object.keys(add).forEach(function(fe){var dk=fe+'_xl',cur=S.vdocs[dk],next={fecha:fe,dev:'xl',lineas:(cur?cur.lineas:[]).concat(add[fe])};S.vdocs[dk]=next;queue('ventas'+dk,function(){return db.doc('ventas/'+dk).set(next)})});

 }).catch(function(e){toast(e&&e.message==='internet'?'Necesito internet una vez para leer el Excel':'No pude leer ese Excel',{bad:true})});

var PH=['Producto','Categoría','Subcategoría','Presentación','Tamaño','Key','Cantidad','Costo total','Costo unitario','PVP','Margen'];
function importProducts(file){
 toast('Leyendo el Excel…',{ms:6000});
 Promise.all([file.arrayBuffer(),loadXlsx()]).then(function(r){
  var wb=XLSX.read(r[0],{type:'array'});
  var names=wb.SheetNames,sn=names.filter(function(n){return /^\s*bbdd\s*$/i.test(n)})[0]||names.filter(function(n){return /producto|bbdd/i.test(n)&&!/borrador/i.test(n)})[0]||names[0];
  var rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
  var hi=-1,col={};
  for(var i=0;i<Math.min(rows.length,15)&&hi<0;i++){var m={};rows[i].forEach(function(h,j){if(h!=null)m[norm(String(h)).trim()]=j});if('producto' in m&&'pvp' in m){hi=i;col=m}}
  if(hi<0){toast('No encontré los encabezados (Producto … PVP) en ese archivo',{bad:true});return}
  var g=function(row,k){var j=col[k];return j==null?null:row[j]};
  var T=function(v){return v==null?'':String(v).replace(/\s+/g,' ').trim()};
  var seen={},items=[],skip=[],dupe=0;
  rows.forEach(function(row,ix){if(ix<=hi)return;var rn=ix+1,pr=T(g(row,'producto'));if(!pr)return;
   var name=T([pr,T(g(row,'presentacion')),T(g(row,'tamano'))].join(' ')),nk=norm(name);
   var pvp=Number(g(row,'pvp')),cant=Number(g(row,'cantidad'))||0,ct=Number(g(row,'costo total'))||0,cu=g(row,'costo unitario');
   cu=(typeof cu==='number'&&isFinite(cu))?cu:(cant>0?ct/cant:0);
   if(!(pvp>0)){skip.push('Fila '+rn+': '+name+' (sin PVP)');return}
   if(seen[nk]){dupe++;return}seen[nk]=1;
   items.push({id:'p'+String(rn-1).padStart(3,'0'),n:name,c:T(g(row,'categoria'))||'Otros',k:Math.round(cu*10000)/10000,p:Math.round(pvp*100)/100,s:cant})});
  var byName={};S.prods.forEach(function(x){byName[norm(x.n)]=x});
  var nuevos=[],exist=[];
  items.forEach(function(it){var x=byName[norm(it.n)];if(x)exist.push({it:it,x:x});else nuevos.push(it)});
  var cambian=exist.filter(function(e){return Math.abs(e.x.k-e.it.k)>1e-6||Math.abs(e.x.p-e.it.p)>1e-6});
  S.pend={nuevos:nuevos,cambian:cambian};
  openModal('<h2>Productos del Excel</h2><p class="big">🆕 <b>'+nuevos.length+'</b> productos nuevos<br>✔ '+(exist.length-cambian.length)+' ya existen igual<br>💲 <b>'+cambian.length+'</b> existen con costo o precio distinto'+(dupe?'<br>↩︎ '+dupe+' repetidos en el archivo (se ignoran)':'')+(skip.length?'<br>⚠️ '+skip.length+' sin PVP (se omiten)':'')+'</p>'+
   (nuevos.length?'<div class="muted" style="font-size:13px;max-height:120px;overflow:auto">'+nuevos.slice(0,40).map(function(x){return esc(x.n)+' — '+money(x.p)}).join('<br>')+'</div>':'')+
   (skip.length?'<div class="muted" style="font-size:12px;margin-top:6px">'+skip.slice(0,8).map(esc).join('<br>')+'</div>':'')+
   '<div class="btns" style="flex-direction:column"><button class="btn ok" data-act="impp_go" data-u="0"'+(nuevos.length?'':' disabled')+'>Agregar solo los nuevos</button>'+(cambian.length?'<button class="btn" data-act="impp_go" data-u="1">Agregar nuevos y actualizar costos/precios</button>':'')+'<button class="btn ghost" data-act="close">Cancelar</button></div>');
 }).catch(function(e){toast(e&&e.message==='internet'?'Necesito internet una vez para leer el Excel':'No pude leer ese archivo',{bad:true})});
}

 csvstock:function(){saveFile('inventario.csv',[['Producto','Categoría','Costo','Precio','Margen %','Stock inicial','Inversión inicial','Reposiciones (costo)','Stock','Estado','Venta diaria','Sugerido comprar','Código de barras']].concat(S.prods.map(function(p){var r=S.m[p.id];return [p.n,p.c,p.k,p.p,p.p>0?r2((p.p-p.k)/p.p*100):'',p.s,r2(inv0(p)),r2(r.buyCost),r.stock,r.estado,r.vel.toFixed(2),r.sug,p.b]})))},
 savecfg:function(){saveCfgForm()},
 sumtoggle:function(){S.sumOpen=!S.sumOpen;renderStockSummary()},
 catsel:function(el){S.cat=el.dataset.c;V.stock.update();var l=$('#catfil');if(l)l.scrollIntoView({block:'center'})},
 plist:function(){S.pk.open&&!S.pk.code?closePicker():openPicker('')},
 plistq:function(){openPicker($('#scan').value)},
 pclose:function(){closePicker()},
 pickcode:function(el){var c=el.dataset.code;closeModal();openPicker('',c)},
 rotf:function(el){S.rotf=el.dataset.r;V.stock.update()},
 crot:function(el){S.crot=el.dataset.r;V.comprar.update()},
 impprod:function(){openModal('<h2>Importar productos de Excel</h2><p class="muted">Tu archivo debe tener estos encabezados en la primera fila (como tu hoja BBDD):</p><p style="font-size:13px;background:var(--bg);padding:10px;border-radius:10px"><b>'+PH.join(' · ')+'</b></p><p class="muted" style="font-size:13px">Se usan: Producto + Presentación + Tamaño (nombre), Categoría, Cantidad (stock inicial), Costo unitario (o Costo total ÷ Cantidad) y PVP. Subcategoría, Key y Margen se pueden dejar vacíos. Funciona con .xlsx o .csv.</p><div class="btns" style="flex-direction:column"><button class="btn" data-act="fpick">Elegir mi Excel…</button><button class="btn ghost" data-act="tpl">Descargar plantilla vacía</button><button class="btn ghost" data-act="close">Cancelar</button></div>')},
 fpick:function(){closeModal();$('#fp').click()},
 tpl:function(){saveBlob('plantilla_productos.csv',csv([PH])).then(function(){toast('Plantilla descargada')},function(){})},
 impp_go:function(el){applyProducts(el.dataset.u==='1')},
 bkpick:function(){bkPick()},
 bkdl:function(){saveBlob('El Market de Fabiano - respaldo.json',backupText()).then(function(){toast('Respaldo descargado')},function(){})},
 bkrest:function(){$('#fr').click()},
 impx:function(){$('#fx').click()},
 void:function(el){var tk=el.dataset.tk;ask('¿Anular esta venta? El stock se devuelve y deja de contar en los reportes.','Anular venta').then(function(ok){if(!ok)return;var ids=S.lines.filter(function(l){return (l.tk||l.id)===tk}).map(function(l){return l.id});mutateLines(ids,'void');toast('Venta anulada')})}
};
function openCamFor(){openCam(function(code){var b=$('#f_b');if(b){b.value=code;okb()}})}
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var f=ACT[el.dataset.act];if(f)f(el,e)});
document.addEventListener('click',function(e){var b=e.target.closest('[data-pk]');if(!b)return;var p=prodById(b.dataset.pk);if(!p)return;
 if(S.pk.code){var c=S.pk.code;closePicker();assignCode(p,c);return}
 addToCart(p,1);okb();var q=S.cart.filter(function(x){return x.p===p.id})[0].q;toast('+1 '+p.n+' · en venta: '+fmt(q)+' · Total '+money(cartTotal()));pickList()});
document.addEventListener('change',function(e){var t=e.target;
 if(t.id==='fp'&&t.files[0]){importProducts(t.files[0]);t.value=''}
 if(t.id==='fx'&&t.files[0]){importExcel(t.files[0]);t.value=''}
 if(t.id==='fr'&&t.files[0]){restoreFile(t.files[0]);t.value=''}
 if(t.classList.contains('qin')){var c=S.cart[+t.dataset.i],v=num(t.value);if(v<=0)S.cart.splice(+t.dataset.i,1);else c.q=v;renderCart()}
});
document.addEventListener('input',function(e){var t=e.target;if(!t.classList||!t.classList.contains('rin'))return;
 var i=+t.dataset.i,k=t.dataset.k,r=S.rcv[i];if(!r)return;var v=num(t.value);
 if(k==='q'){r.q=v;if(r.m==='t'){r.c=v>0?Math.round(r.t/v*1e6)/1e6:r.c;setRin(i,'c',f4(r.c))}else{r.t=r2(v*r.c);setRin(i,'t',f4(r.t))}}
 else if(k==='c'){r.c=v;r.m='c';r.t=r2(r.q*v);setRin(i,'t',f4(r.t))}
 else{r.t=v;r.m='t';r.c=r.q>0?Math.round(v/r.q*1e6)/1e6:r.c;setRin(i,'c',f4(r.c))}
 updRtot()});
document.addEventListener('keydown',function(e){
 if(e.key==='F2'){e.preventDefault();if(S.view==='vender'&&!modalOpen())commitSale();return}
 if(e.key==='Escape'&&modalOpen()){closeModal();return}
 if(modalOpen()||e.ctrlKey||e.metaKey||e.altKey)return;
 var t=e.target;if(t&&t.matches&&t.matches('input,textarea,select,button'))return;
 if(e.key.length===1){var s=S.view==='vender'?$('#scan'):S.view==='stock'?$('#q'):null;if(s)s.focus()}
});
document.addEventListener('click',function(e){var t=e.target;if(t.id==='modal'&&!S.askRes)closeModal()});
document.addEventListener('focusin',function(e){if(e.target.matches&&e.target.matches('.qin,.rin,#np'))e.target.select()});

/* ---------- arranque ---------- */
function err(e){toast('Problema de conexión con los datos',{bad:true})}
function start(){
 db.doc('config/catalogo').onSnapshot(function(s){S.prods=(s.exists&&s.data()&&s.data().productos)||[];S.loaded.cat=true;changed()},err);
 db.doc('config/ajustes').onSnapshot(function(s){S.cfg=mergeCfg(s.exists?s.data():null);S.loaded.cfg=true;changed()},err);
 db.collection('ventas').onSnapshot(function(s){var o={};s.docs.forEach(function(d){o[d.id]=d.data()});S.vdocs=o;S.loaded.v=true;changed()},err);
 db.collection('compras').onSnapshot(function(s){var o={};s.docs.forEach(function(d){o[d.id]=d.data()});S.cdocs=o;S.loaded.c=true;changed()},err);
}
function initLocal(){loadLocalData().then(function(d){db=makeLocalDb(d);S.mode='local';start();initBackup();try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}})}
function boot(){
 derive();switchView('vender');changed();
 var use=(window.claude&&window.claude.use)?function(n){return window.claude.use(n)}:function(){return Promise.resolve(null)};
 use('downloads').then(function(d){S.dl=d}).catch(function(){});
 use('db').then(function(real){if(real){db=real;S.mode='nube';start()}else if(window.FB_CONFIG)initCloud();else initLocal()}).catch(initLocal);
}
boot();
if(/[?&]scan=1/.test(location.search))setTimeout(function(){if(S.view==='vender'&&!modalOpen())camPick()},1500);
})();
</script>
